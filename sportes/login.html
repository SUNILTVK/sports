<!doctype html>
<html>
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login - BD-PE A&O</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="navbar"><a class="brand" href="index.html">BD-PE A&O</a></header>
    <main style="padding:40px;display:flex;justify-content:center;align-items:flex-start">
      <div class="glass" style="padding:22px;max-width:420px;width:100%">
        <h2>Teacher / Student Login</h2>
        <form>
          <label>Email</label>
          <input style="width:100%;padding:10px;margin-top:6px;margin-bottom:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06)" placeholder="you@school.edu">
          <label>Password</label>
          <input type="password" style="width:100%;padding:10px;margin-top:6px;margin-bottom:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06)">
          <div style="display:flex;gap:10px">
            <button class="btn neon">Login</button>
            <a class="btn glass" href="register.html">Register</a>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
